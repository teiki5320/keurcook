# Vérifie, construit et publie le site statique sur Cloudflare Pages (projet « keurcook »).
# Se lance à chaque push sur main, chaque lundi, mercredi et vendredi (articles « Conseils » programmés),
# à la main (onglet Actions) et après le bouton « Maintenance ».
name: Publier le site

on:
  push:
    branches: [main]
    # Le passage Pinterest du matin n'enregistre que son fichier d'état : pas besoin de republier le site.
    paths-ignore: [data/pinterest-etat.json]
  workflow_dispatch:
  workflow_call:
  # Chaque lundi, mercredi et vendredi à 0 h 15 (heure de Paris en hiver, 1 h 15 en été) : publie les articles programmés.
  schedule:
    - cron: "15 23 * * 0,2,4"

permissions:
  contents: read
  # Pour réactiver la tâche programmée (voir la dernière étape).
  actions: write

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (dernière version de main)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Installer Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (lint + types)
        run: |
          npm run lint
          npm run typecheck

      - name: Lancer les tests
        run: npm test

      - name: Construire le site statique (dossier out/)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://keurcook.com
          NEXT_TELEMETRY_DISABLED: 1

      # Repère propre à cette publication : la dernière étape vérifie que keurcook.com le sert bien.
      - name: Marquer la version publiée
        run: echo "${GITHUB_SHA} ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > out/version.txt

      # Les secrets ne sont donnés qu'aux étapes qui en ont besoin (pas à l'installation ni au build).
      # Sans eux, la publication échoue (en rouge, avec un e-mail de GitHub) au lieu de passer pour réussie.
      - name: Vérifier la présence des secrets Cloudflare
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID absents : rien n'est publié."
            exit 1
          fi

      - name: Publier sur Cloudflare Pages
        env:
          # Réglés par le propriétaire dans Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler est figé dans package-lock.json (installé par npm ci). Le projet « keurcook » existe déjà.
          npx wrangler pages deploy out --project-name=keurcook --branch=main --commit-dirty=true

      # Le site en ligne doit servir la version qui vient d'être publiée (jusqu'à 3 minutes d'attente).
      - name: Vérifier que keurcook.com sert la nouvelle version
        run: |
          attendu="$(cat out/version.txt)"
          for i in $(seq 1 18); do
            servi="$(curl -fsS -H 'Cache-Control: no-cache' "https://keurcook.com/version.txt?v=${GITHUB_RUN_ID}-${i}" || true)"
            if [ "$servi" = "$attendu" ]; then
              echo "keurcook.com sert bien la version $attendu"
              exit 0
            fi
            sleep 10
          done
          echo "::error::keurcook.com ne sert pas la nouvelle version (attendu « $attendu », reçu « $servi »)."
          exit 1

      # GitHub coupe les tâches programmées d'un dépôt public après 60 jours sans activité :
      # chaque publication programmée réactive la tâche, pour que les articles continuent de paraître.
      - name: Garder la publication programmée active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
