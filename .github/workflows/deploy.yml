# Vérifie, construit et publie le site statique sur Cloudflare Pages (projet « keurcook »).
# Se lance à chaque push sur main, chaque lundi, mercredi et vendredi (articles « Conseils » programmés),
# à la main (onglet Actions) et après le bouton « Maintenance ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  # Chaque lundi, mercredi et vendredi à 0 h 15 (heure de Paris en hiver, 1 h 15 en été) : publie les articles programmés.
  schedule:
    - cron: "15 23 * * 0,2,4"

permissions:
  contents: read
  # Pour réactiver la tâche programmée (voir la dernière étape).
  actions: write

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (dernière version de main)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Installer Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (lint + types)
        run: |
          npm run lint
          npm run typecheck

      - name: Lancer les tests
        run: npm test

      - name: Construire le site statique (dossier out/)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://keurcook.com
          NEXT_TELEMETRY_DISABLED: 1

      # Les secrets ne sont donnés qu'aux étapes qui en ont besoin (pas à l'installation ni au build).
      - name: Vérifier la présence des secrets Cloudflare
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ajoutez les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour publier le site."
          fi

      - name: Publier sur Cloudflare Pages
        if: steps.secrets.outputs.ok == 'true'
        env:
          # Réglés par le propriétaire dans Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler est figé dans package-lock.json (installé par npm ci).
          # Crée le projet « keurcook » à la première publication (sans effet s'il existe déjà).
          npx wrangler pages project create keurcook --production-branch=main || true
          npx wrangler pages deploy out --project-name=keurcook --branch=main --commit-dirty=true

      # IndexNow : prévient Bing (et DuckDuckGo, Ecosia, Yandex…) des pages publiées.
      # La clé est publique par nature : elle est servie à la racine du site (public/229a9f2486bf3431b6b9abc0c8e5bf78.txt).
      - name: Prévenir les moteurs de recherche (IndexNow)
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: |
          node -e '
            const fs = require("node:fs");
            const urls = [...fs.readFileSync("out/sitemap.xml", "utf8").matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
            if (!urls.length) { console.log("Sitemap vide (maintenance) : rien à envoyer."); process.exit(0); }
            fs.writeFileSync("indexnow.json", JSON.stringify({ host: "keurcook.com", key: "229a9f2486bf3431b6b9abc0c8e5bf78", keyLocation: "https://keurcook.com/229a9f2486bf3431b6b9abc0c8e5bf78.txt", urlList: urls }));
            console.log(urls.length + " adresses à envoyer.");
          '
          if [ -f indexnow.json ]; then
            curl -sS -o /dev/null -w "IndexNow : réponse %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
          fi

      # GitHub coupe les tâches programmées d'un dépôt public après 60 jours sans activité :
      # chaque publication programmée réactive la tâche, pour que les articles continuent de paraître.
      - name: Garder la publication programmée active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
