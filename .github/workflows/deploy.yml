# Vérifie, construit et publie le site statique sur Cloudflare Pages (projet « keurcook »).
# Se lance à chaque push sur main, chaque lundi (articles « Conseils » programmés),
# à la main (onglet Actions) et après le bouton « Maintenance ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  # Chaque lundi à 0 h 15 (heure de Paris en hiver, 1 h 15 en été) : publie les articles programmés.
  schedule:
    - cron: "15 23 * * 0"

permissions:
  contents: read

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      # Réglés par le propriétaire dans Settings → Secrets and variables → Actions.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Récupérer le code (dernière version de main)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (lint + types)
        run: |
          npm run lint
          npm run typecheck

      - name: Lancer les tests
        run: npm test

      - name: Construire le site statique (dossier out/)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://keurcook.com
          NEXT_TELEMETRY_DISABLED: 1

      - name: Publier sur Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages deploy out --project-name=keurcook --branch=main --commit-dirty=true

      - name: Publication ignorée (secrets Cloudflare absents)
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Ajoutez les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour publier le site."
